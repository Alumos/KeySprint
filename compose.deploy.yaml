services:
  keysprint:
    image: ${KEYSPRINT_IMAGE:-ghcr.io/alumos/keysprint}:${KEYSPRINT_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      CLASS_SYSTEM_URL: ${CLASS_SYSTEM_URL:-}
      CLASS_SYSTEM_PATH: ${CLASS_SYSTEM_PATH:-/api/integration/classes}
      CLASS_SYSTEM_TOKEN: ${CLASS_SYSTEM_TOKEN:-}
      CLASS_SYSTEM_TIMEOUT: ${CLASS_SYSTEM_TIMEOUT:-8s}
    volumes:
      - keysprint_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  keysprint_data:
    name: ${DATA_VOLUME_NAME:-keysprint_data}
