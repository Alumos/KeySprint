name: Verify and publish image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: ghcr.io/alumos/keysprint

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate version metadata
        run: ./scripts/check-version.sh

      - name: Test backend
        working-directory: backend
        run: go test ./...

      - name: Test and build frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm test && npm run build

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build information
        id: build
        run: |
          echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=KeySprint
            org.opencontainers.image.description=面向课堂的中文打字训练与实时竞赛系统
            org.opencontainers.image.version=${{ steps.build.outputs.version }}

      - name: Sign in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            VCS_REF=${{ steps.build.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  windows:
    name: Windows portable package
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build

      - name: Resolve build information
        id: build
        shell: bash
        run: |
          echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Build and package
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version ${{ steps.build.outputs.version }} -Commit ${{ steps.build.outputs.commit }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: keysprint-windows-x64
          # Upload the folder contents (not the inner zip) so downloading the
          # artifact and unzipping it once yields the runnable files directly.
          path: dist-windows/KeySprint-Windows-x64/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: keysprint-windows-x64
          path: release-assets

      - name: Create GitHub Release
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            exit 0
          fi
          prerelease=()
          if [[ "$tag" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$tag" --verify-tag \
            --title "KeySprint ${tag#v}" --generate-notes "${prerelease[@]}"

      - name: Attach Windows package
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          cd release-assets
          zip -r -q "keysprint-${version}-windows-x64.zip" .
          gh release upload "$tag" "keysprint-${version}-windows-x64.zip" --clobber
